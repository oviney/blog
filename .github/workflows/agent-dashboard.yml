name: Agent Observability Dashboard

on:
  schedule:
    # 09:30 UTC on the 1st — after agent-rework-tracking and workflow-roi
    # (both 09:00 on the 1st), matching the monthly rhythm they already use.
    #
    # Was weekly, which was 4x more often than the data can change: every KPI
    # in agents-data.json is either a 30-day window (agentPRsMerged30d) or a
    # monthly billing figure (copilotUsage.billingCycleStart/End,
    # seatCostPerMonth). A weekly refresh of monthly data produced a PR that
    # could not self-serve — bot-authored PRs sit in `action_required` so no
    # check ever runs on them — which the orchestrator then labelled
    # needs-human-review after 2h, and which the following week's run
    # superseded. 4 of the 8 refresh PRs to date were closed unmerged that way;
    # #1296 sat open for 12 days.
    - cron: "30 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

jobs:
  build-dashboard:
    name: Refresh agent dashboard data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build agents-data.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-dashboard-data.js

      - name: Create pull request for updated data
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            📊 dashboard: refresh agent observability data

            - Generated by agent-dashboard.yml
            - Workflow run: ${{ github.run_id }}

            Co-Authored-By: Agent Dashboard <agent-dashboard@github.com>
          author: Agent Dashboard <agent-dashboard@github.com>
          committer: Agent Dashboard <agent-dashboard@github.com>
          branch: automation/agent-dashboard-data
          delete-branch: true
          title: "📊 dashboard: refresh agent observability data"
          body: |
            Automated dashboard data refresh generated by `agent-dashboard.yml`.

            - Source workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Updates: `dashboard/agents-data.json`

            This PR avoids pushing directly to the protected `main` branch.

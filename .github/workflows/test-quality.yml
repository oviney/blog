name: Quality Tests (Visual, Accessibility, Performance, Security)

# ---------------------------------------------------------------------------
# PR path (blocking, budgeted): build the site once, then run two jobs against
# that one artifact — the page contract and the pixel gate. Nothing else gates a
# PR. The full 138-test suite, pa11y and Lighthouse run nightly.
#
# This replaced a PR path that cost 13.3 billable job-minutes and ~5 minutes of
# wall-clock, rebuilt Jekyll four times, and in seven months caught one real
# product regression (72c1666, a 320px horizontal overflow) against 32 of 62
# test commits spent repairing the tests themselves. The contract suite still
# asserts that regression's class on every page, so the one thing the old gate
# ever caught is the one thing this gate is built around.
#
# Change-based selection (scripts/select-tests.sh) is gone from the PR path. It
# routed @REQ-* greps that never selected @REQ-VISUAL-SNAP, @REQ-PAGE-CHROME,
# @REQ-CONTENT-03/04 or @REQ-CONTENT-CAPTION-CASE, so those tests silently did
# not run on any targeted run. The contract suite is small enough to always run
# in full, which removes the need to choose.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly full-suite run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the full Playwright suite, pa11y and Lighthouse on this branch'
        required: false
        default: false
        type: boolean
      update_snapshots:
        description: 'Refresh visual-regression baselines (-linux PNGs) and commit them to the branch'
        required: false
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Build the site exactly once. Every downstream job consumes this artifact, so
  # the contract suite and the pixel gate are judging identical bytes.
  # ---------------------------------------------------------------------------
  build-site:
    name: 🏗️ Build Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-build-quality
          path: _site/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Blocking gate 1: the page contract. Small, fast, and every assertion in it
  # describes something a reader would hit — a page that 404s, a page with no
  # heading, a console error, a sideways scroll on a phone, navigation that will
  # not open, a nav link that leads nowhere.
  # ---------------------------------------------------------------------------
  page-contract:
    name: 🎭 Page Contract
    runs-on: ubuntu-latest
    needs: build-site

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-build-quality
          path: _site/

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Serve built site
        run: |
          # --skip-initial-build serves the downloaded artifact rather than
          # rebuilding it, which is the point of the build-once split.
          bundle exec jekyll serve --port 4000 --detach --skip-initial-build
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Run page contract
        env:
          CI: true
        run: npm run test:contract

      - name: Upload contract results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: page-contract-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Blocking gate 2: the pixel gate. Retained on PRs deliberately. The failure
  # mode worth fixing was baselines moving on every content publish, and #1186 +
  # #1191 fixed it — no page's baseline now moves when an article ships. What
  # remains is a genuine design-change signal, which is what a pixel gate is for.
  #
  # Seed/refresh baselines by dispatching this workflow on the target branch with
  # update_snapshots=true — the job commits the refreshed PNGs back to that
  # branch. Seeding deliberately commits rather than leaving the operator to
  # download an artifact by hand: the original baselines were captured on a
  # branch that predated the newsletter-CTA change, hand-committed, then
  # squash-merged onto a main that already had it, so the gate was red from its
  # first run.
  # ---------------------------------------------------------------------------
  visual-regression:
    name: 🖼️ Visual Regression
    runs-on: ubuntu-latest
    needs: build-site
    permissions:
      contents: write   # seed mode commits refreshed baselines to the branch

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-build-quality
          path: _site/

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Serve built site
        run: |
          bundle exec jekyll serve --port 4000 --detach --skip-initial-build
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Compare visual snapshots
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:visual:snap

      - name: Refresh visual baselines (seed mode)
        if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:snap:update

      - name: Upload refreshed baselines (seed mode)
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/playwright-agents/visual-snapshot.spec.ts-snapshots/
          retention-days: 7

      # Commit the pixels we just rendered back to the dispatched branch. main is
      # refused outright: it is protected, so a push would fail anyway, and
      # baselines belong on a branch that can be reviewed before they become the
      # reference every later PR is judged against.
      - name: Commit refreshed baselines (seed mode)
        if: ${{ inputs.update_snapshots }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "::error::Refusing to seed baselines directly on main."
            echo "Dispatch this workflow on a branch, review the baseline diff, then merge."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/playwright-agents/visual-snapshot.spec.ts-snapshots/

          if git diff --cached --quiet; then
            echo "Baselines already match this branch's render — nothing to commit."
            exit 0
          fi

          git commit -m "test(visual): refresh -linux baselines via seed dispatch

          Rendered by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID} on ${GITHUB_SHA}."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Content validation — cheap, no browser, no build.
  # ---------------------------------------------------------------------------
  content-validation:
    name: 📝 Content Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Validate post quality
        run: |
          set +e
          bash scripts/validate-post-quality.sh
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "⚠️ Post quality warnings found (non-blocking)"
            exit 0
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  # Security audit — cheap, no browser, no build.
  # ---------------------------------------------------------------------------
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Check Puppeteer support floor
        run: npm run test:deps

      - name: Run security audit
        run: npm run test:security

  # ---------------------------------------------------------------------------
  # Nightly: the full suite, pa11y and Lighthouse. Not a PR gate — it is a broad
  # net whose findings become issues, not merge blocks. A PR should not wait five
  # minutes for a Lighthouse score that has never once blocked a merge on merit.
  # ---------------------------------------------------------------------------
  nightly-full-suite:
    name: 🌙 Nightly Full Suite
    runs-on: ubuntu-latest
    needs: build-site
    if: github.event_name == 'schedule' || inputs.full_suite
    permissions:
      contents: read

    # Surfaced so the alarm job below can report which part broke. Job outputs
    # are the only way to get step-level detail across a job boundary.
    outputs:
      playwright: ${{ steps.playwright.outcome }}
      a11y: ${{ steps.a11y.outcome }}
      lighthouse: ${{ steps.lighthouse.outcome }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-build-quality
          path: _site/

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Serve built site
        run: |
          bundle exec jekyll serve --port 4000 --detach --skip-initial-build
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Run full Playwright suite
        id: playwright
        env:
          CI: true
        run: npm run test:playwright

      - name: Run accessibility tests
        id: a11y
        if: always()
        run: npm run test:a11y

      - name: Run Lighthouse CI
        id: lighthouse
        if: always()
        run: npm run test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload nightly artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # A nightly failure nobody sees is the same as no nightly. This lived as a step
  # inside 🌙 Nightly Full Suite, which meant it only fired when *that* job failed
  # — so when 🔒 Security Audit broke on 2026-08-04 and 08-05 the nightly went red
  # two nights running and filed nothing, because the suite job itself was green.
  #
  # It is a separate job so it can watch every sibling. `if: always()` is required:
  # without it the job is skipped the moment a dependency fails, which is exactly
  # when it needs to run.
  #
  # It also fires on a manual `full_suite` dispatch, which matches 🌙 Nightly Full
  # Suite's own trigger. That is deliberate: an alarm you cannot test on demand is
  # how the previous one went two nights without anyone noticing it was mute.
  # ---------------------------------------------------------------------------
  nightly-alarm:
    name: 🔔 Nightly Alarm
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'schedule' || inputs.full_suite)
    needs:
      - build-site
      - page-contract
      - visual-regression
      - content-validation
      - security
      - nightly-full-suite
    permissions:
      contents: read
      issues: write

    steps:
      # One issue per failing night, deduped by title so a persistent failure
      # comments on the existing issue instead of opening a new one every day.
      - name: Open an issue when any nightly job fails
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Nightly quality suite failing"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          The nightly run failed on \`main\`.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}

          | Job | Result |
          |-----|--------|
          | 🏗️ Build Site | ${{ needs.build-site.result }} |
          | 🎭 Page Contract | ${{ needs.page-contract.result }} |
          | 🖼️ Visual Regression | ${{ needs.visual-regression.result }} |
          | 📝 Content Validation | ${{ needs.content-validation.result }} |
          | 🔒 Security Audit | ${{ needs.security.result }} |
          | 🌙 Nightly Full Suite | ${{ needs.nightly-full-suite.result }} |

          Within the full suite:

          | Step | Outcome |
          |------|---------|
          | Playwright | ${{ needs.nightly-full-suite.outputs.playwright }} |
          | pa11y | ${{ needs.nightly-full-suite.outputs.a11y }} |
          | Lighthouse | ${{ needs.nightly-full-suite.outputs.lighthouse }} |

          Note that 🔒 Security Audit *does* gate PRs — if it is failing here it is
          also blocking every open PR. The rest of this run does not gate merges;
          triage decides whether a finding becomes a fix, a new contract test, or
          an accepted risk.
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label "agent:qa-gatekeeper" --body "$BODY"
          fi

name: Quality Tests (Visual, Accessibility, Performance, Security)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly full-suite run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full Playwright suite regardless of changed files'
        required: false
        default: 'false'
        type: boolean
      update_snapshots:
        description: 'Refresh visual-regression baselines (-linux PNGs) and upload them as an artifact'
        required: false
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Determine which tests to run based on changed files
  # ---------------------------------------------------------------------------
  select-tests:
    name: 🔍 Select Tests (change-based)
    runs-on: ubuntu-latest
    outputs:
      test_groups:      ${{ steps.select.outputs.test_groups }}
      full_suite:       ${{ steps.select.outputs.full_suite }}
      skip_playwright:  ${{ steps.select.outputs.skip_playwright }}
      playwright_grep:  ${{ steps.select.outputs.playwright_grep }}
      selection_reason: ${{ steps.select.outputs.selection_reason }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full history for merge-base against the PR base

      - name: Select test groups from diff
        id: select
        env:
          # On a PR, diff against the target branch; on a push to main, the
          # previous commit is the right base. select-tests.sh merge-bases this
          # with HEAD so a stale branch does not pull in unrelated main changes.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          # Force full suite on nightly cron or manual dispatch with full_suite=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "test_groups=ALL"             >> "$GITHUB_OUTPUT"
            echo "full_suite=true"             >> "$GITHUB_OUTPUT"
            echo "skip_playwright=false"       >> "$GITHUB_OUTPUT"
            echo "playwright_grep="            >> "$GITHUB_OUTPUT"
            echo "selection_reason=nightly scheduled run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ inputs.full_suite }}" == "true" ]]; then
            echo "test_groups=ALL"             >> "$GITHUB_OUTPUT"
            echo "full_suite=true"             >> "$GITHUB_OUTPUT"
            echo "skip_playwright=false"       >> "$GITHUB_OUTPUT"
            echo "playwright_grep="            >> "$GITHUB_OUTPUT"
            echo "selection_reason=manual dispatch full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run the selection script and capture outputs
          bash scripts/select-tests.sh > /tmp/select_env.sh
          source /tmp/select_env.sh

          echo "test_groups=${TEST_GROUPS}"             >> "$GITHUB_OUTPUT"
          echo "full_suite=${FULL_SUITE}"               >> "$GITHUB_OUTPUT"
          echo "skip_playwright=${SKIP_PLAYWRIGHT}"     >> "$GITHUB_OUTPUT"
          echo "playwright_grep=${PLAYWRIGHT_GREP}"     >> "$GITHUB_OUTPUT"
          echo "selection_reason=${SELECTION_REASON}"   >> "$GITHUB_OUTPUT"

          echo "### 🔍 Test Selection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Groups | \`${TEST_GROUPS}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full suite | \`${FULL_SUITE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skip Playwright | \`${SKIP_PLAYWRIGHT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Grep | \`${PLAYWRIGHT_GREP:-none}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reason | ${SELECTION_REASON} |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Blocking pixel gate: Playwright toHaveScreenshot on the core page types.
  # Runs on EVERY pull_request/push (independent of change-based selection) so a
  # required status check never deadlocks waiting on a skipped job. Unlike every
  # other Playwright job in this workflow it carries NO `continue-on-error`, so a
  # pixel diff reds the check and blocks the merge. Seed/refresh baselines by
  # dispatching this workflow on the target branch with update_snapshots=true —
  # the job commits the refreshed PNGs straight back to that branch.
  #
  # Seeding deliberately commits rather than leaving the operator to download the
  # artifact by hand: the original baselines were captured on a branch that
  # predated the newsletter-CTA change, hand-committed, and then squash-merged
  # onto a main that already had it, so the gate was red from its first run.
  # Committing from the same checkout that rendered the pixels keeps the baseline
  # and the markup that produced it in lockstep.
  # ---------------------------------------------------------------------------
  visual-regression:
    name: 🖼️ Visual Regression
    runs-on: ubuntu-latest
    permissions:
      contents: write   # seed mode commits refreshed baselines to the branch

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start Jekyll server
        run: |
          bundle exec jekyll serve --port 4000 --detach
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Compare visual snapshots
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:visual:snap

      - name: Refresh visual baselines (seed mode)
        if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:snap:update

      - name: Upload refreshed baselines (seed mode)
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/playwright-agents/visual-snapshot.spec.ts-snapshots/
          retention-days: 7

      # Commit the pixels we just rendered back to the dispatched branch. main is
      # refused outright: it is protected, so a push would fail anyway, and
      # baselines belong on a branch that can be reviewed before they become the
      # reference every later PR is judged against.
      - name: Commit refreshed baselines (seed mode)
        if: ${{ inputs.update_snapshots }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "::error::Refusing to seed baselines directly on main."
            echo "Dispatch this workflow on a branch, review the baseline diff, then merge."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/playwright-agents/visual-snapshot.spec.ts-snapshots/

          if git diff --cached --quiet; then
            echo "Baselines already match this branch's render — nothing to commit."
            exit 0
          fi

          git commit -m "test(visual): refresh -linux baselines via seed dispatch

          Rendered by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID} on ${GITHUB_SHA}."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Step 2: Content Validation (post quality checks)
  # ---------------------------------------------------------------------------
  content-validation:
    name: 📝 Content Validation
    runs-on: ubuntu-latest
    needs: select-tests
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Validate post quality
        run: |
          set +e
          bash scripts/validate-post-quality.sh
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "⚠️ Post quality warnings found (non-blocking)"
            exit 0
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  # Step 3: Non-Playwright quality checks (always run unless CI-only change)
  # ---------------------------------------------------------------------------
  quality-checks:
    name: 🎯 Accessibility, Visual & Lighthouse
    runs-on: ubuntu-latest
    needs: select-tests
    if: needs.select-tests.outputs.skip_playwright != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Start Jekyll server
        run: |
          bundle exec jekyll serve --port 4000 --detach
          echo "Waiting for Jekyll server to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then
              echo "Jekyll server is ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -f http://localhost:4000/ || { echo "Jekyll server failed to start"; exit 1; }

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Step 2b: Security audit (always run)
  # ---------------------------------------------------------------------------
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: select-tests

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Check Puppeteer support floor
        run: npm run test:deps

      - name: Run security audit
        run: npm run test:security

  # ---------------------------------------------------------------------------
  # Step 3 (full): Playwright — Shard 1 (Navigation + Mobile)
  # ---------------------------------------------------------------------------
  playwright-shard1:
    name: 🎭 Playwright Shard 1/3
    runs-on: ubuntu-latest
    needs: select-tests
    if: needs.select-tests.outputs.skip_playwright != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start Jekyll server
        run: |
          bundle exec jekyll serve --port 4000 --detach
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Run Playwright Shard 1
        env:
          CI: true
          PLAYWRIGHT_SHARD: '1/3'
          PLAYWRIGHT_GREP: ${{ needs.select-tests.outputs.playwright_grep }}
          TEST_GROUPS: ${{ needs.select-tests.outputs.test_groups }}
          FULL_SUITE: ${{ needs.select-tests.outputs.full_suite }}
          SELECTION_REASON: ${{ needs.select-tests.outputs.selection_reason }}
        run: npm run test:playwright

      - name: Upload Playwright results (shard 1)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-shard1
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Step 3 (full): Playwright — Shard 2 (Content + Search + Links)
  # ---------------------------------------------------------------------------
  playwright-shard2:
    name: 🎭 Playwright Shard 2/3
    runs-on: ubuntu-latest
    needs: select-tests
    if: needs.select-tests.outputs.skip_playwright != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start Jekyll server
        run: |
          bundle exec jekyll serve --port 4000 --detach
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Run Playwright Shard 2
        env:
          CI: true
          PLAYWRIGHT_SHARD: '2/3'
          PLAYWRIGHT_GREP: ${{ needs.select-tests.outputs.playwright_grep }}
          TEST_GROUPS: ${{ needs.select-tests.outputs.test_groups }}
          FULL_SUITE: ${{ needs.select-tests.outputs.full_suite }}
          SELECTION_REASON: ${{ needs.select-tests.outputs.selection_reason }}
        run: npm run test:playwright

      - name: Upload Playwright results (shard 2)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-shard2
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Step 3 (full): Playwright — Shard 3 (Accessibility + Visual + Performance)
  # ---------------------------------------------------------------------------
  playwright-shard3:
    name: 🎭 Playwright Shard 3/3
    runs-on: ubuntu-latest
    needs: select-tests
    if: needs.select-tests.outputs.skip_playwright != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start Jekyll server
        run: |
          bundle exec jekyll serve --port 4000 --detach
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -f http://localhost:4000/ || exit 1

      - name: Run Playwright Shard 3
        env:
          CI: true
          PLAYWRIGHT_SHARD: '3/3'
          PLAYWRIGHT_GREP: ${{ needs.select-tests.outputs.playwright_grep }}
          TEST_GROUPS: ${{ needs.select-tests.outputs.test_groups }}
          FULL_SUITE: ${{ needs.select-tests.outputs.full_suite }}
          SELECTION_REASON: ${{ needs.select-tests.outputs.selection_reason }}
        run: npm run test:playwright

      - name: Upload Playwright results (shard 3)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-shard3
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Step 4: Quality report (aggregates full-suite shard results)
  # ---------------------------------------------------------------------------
  quality-report:
    name: 📊 Quality Report
    runs-on: ubuntu-latest
    needs:
      - select-tests
      - playwright-shard1
      - playwright-shard2
      - playwright-shard3
    if: |
      always() &&
      needs.select-tests.outputs.skip_playwright != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + cache + install deps
        uses: ./.github/actions/setup-node-with-puppeteer-cache

      - name: Download shard 1 results
        uses: actions/download-artifact@v8
        with:
          name: playwright-results-shard1
          path: test-results-shard1/
        continue-on-error: true

      - name: Download shard 2 results
        uses: actions/download-artifact@v8
        with:
          name: playwright-results-shard2
          path: test-results-shard2/
        continue-on-error: true

      - name: Download shard 3 results
        uses: actions/download-artifact@v8
        with:
          name: playwright-results-shard3
          path: test-results-shard3/
        continue-on-error: true

      - name: Merge shard results
        run: |
          mkdir -p test-results
          for shard in 1 2 3; do
            src="test-results-shard${shard}/results.json"
            if [ -f "$src" ]; then
              echo "Found results for shard ${shard}"
              cp "$src" "test-results/results-shard${shard}.json"
            else
              echo "::warning::No results.json for shard ${shard} — report will undercount"
            fi
          done
          # Concatenate every shard's `suites` array. Previously this copied
          # shard 1's file over `results.json` and dropped shards 2 and 3, so the
          # report described a third of the run as if it were the whole thing.
          node -e '
            const fs = require("fs");
            const merged = { suites: [], errors: [] };
            let found = 0;
            for (const n of [1, 2, 3]) {
              const f = `test-results/results-shard${n}.json`;
              if (!fs.existsSync(f)) continue;
              try {
                const j = JSON.parse(fs.readFileSync(f, "utf8"));
                merged.suites.push(...(j.suites || []));
                merged.errors.push(...(j.errors || []));
                found++;
              } catch (e) {
                console.error(`::warning::Could not parse shard ${n} results: ${e.message}`);
              }
            }
            fs.writeFileSync("test-results/results.json", JSON.stringify(merged));
            console.log(`Merged ${found}/3 shard result files, ${merged.suites.length} top-level suites`);
          '

      - name: Generate quality report
        env:
          TEST_GROUPS: ${{ needs.select-tests.outputs.test_groups }}
          FULL_SUITE: ${{ needs.select-tests.outputs.full_suite }}
          SKIP_PLAYWRIGHT: 'false'
          SELECTION_REASON: ${{ needs.select-tests.outputs.selection_reason }}
        run: node scripts/generate-quality-report.js

      - name: Upload quality report artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: quality-report.json
          retention-days: 30

      - name: 📊 Monitor healing effectiveness
        if: always()
        run: npm run monitor:healing || echo "⚠️ Monitoring collection failed (non-blocking)"
        continue-on-error: true

      - name: 🔍 Analyze test results
        if: always()
        run: npm run alert:system || echo "⚠️ Alert analysis failed (non-blocking)"
        continue-on-error: true

      - name: Upload healing monitoring data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: healing-monitoring-data
          path: |
            healing-metrics/
            healing-reports/
            healing-alerts/
          retention-days: 30

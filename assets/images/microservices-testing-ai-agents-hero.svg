<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Velocity Illusion: Microservices Testing in the Era of AI Agents</title>
  <desc>A robotic arm presses approve on a pull request while a tangle of microservice nodes burns behind it, beneath a large green checkmark.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E3120B"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="greenCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Economist Red Top Banner Bar -->
  <rect x="0" y="0" width="1600" height="16" fill="#E3120B"/>

  <!-- Background Grid Lines (Network Fabric) -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="200" y1="100" x2="1400" y2="100"/>
    <line x1="200" y1="300" x2="1400" y2="300"/>
    <line x1="200" y1="500" x2="1400" y2="500"/>
    <line x1="200" y1="700" x2="1400" y2="700"/>
    <line x1="350" y1="50" x2="350" y2="850"/>
    <line x1="700" y1="50" x2="700" y2="850"/>
    <line x1="1050" y1="50" x2="1050" y2="850"/>
  </g>

  <!-- Microservices Network (Left and Centre-Left) -->
  <g id="microservice-nodes">
    <!-- Connecting Service Edges / Network Pipes -->
    <path d="M 250 250 L 480 200 L 720 320 L 450 480 L 250 250 Z" fill="none" stroke="#E3120B" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 480 200 L 850 180 L 680 450 L 480 200 Z" fill="none" stroke="#EF4444" stroke-width="3.5" opacity="0.6"/>
    <path d="M 450 480 L 750 650 L 980 500 L 680 450 Z" fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Broken Contract Flame Effects behind Nodes -->
    <path d="M 440 220 C 420 150, 520 130, 490 80 C 470 140, 420 160, 440 220 Z" fill="url(#fireGrad)" opacity="0.9"/>
    <path d="M 700 340 C 680 260, 760 220, 730 170 C 700 240, 660 260, 700 340 Z" fill="url(#fireGrad)" opacity="0.85"/>
    <path d="M 430 500 C 400 420, 480 400, 450 340 C 430 400, 390 420, 430 500 Z" fill="url(#fireGrad)" opacity="0.8"/>

    <!-- Microservice Nodes (Cube/Hexagon Containers) -->
    <g transform="translate(250, 250)">
      <polygon points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#38BDF8"/>
    </g>

    <g transform="translate(480, 200)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#1E293B" stroke="#E3120B" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#E3120B"/>
    </g>

    <g transform="translate(720, 320)">
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#1E293B" stroke="#F97316" stroke-width="4"/>
      <circle cx="0" cy="0" r="16" fill="#F97316"/>
    </g>

    <g transform="translate(450, 480)">
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#1E293B" stroke="#EF4444" stroke-width="3"/>
      <circle cx="0" cy="0" r="12" fill="#EF4444"/>
    </g>

    <g transform="translate(680, 450)">
      <polygon points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#94A3B8"/>
    </g>

    <g transform="translate(750, 650)">
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#38BDF8"/>
    </g>

    <!-- Spark and Debris Particles -->
    <circle cx="490" cy="110" r="5" fill="#FBBF24"/>
    <circle cx="510" cy="140" r="4" fill="#E3120B"/>
    <circle cx="740" cy="210" r="6" fill="#F97316"/>
    <circle cx="710" cy="190" r="3" fill="#FBBF24"/>
  </g>

  <!-- Right Side: Interface Card with Glowing Green Approval Badge -->
  <g transform="translate(1020, 220)">
    <!-- Pull Request / Build Panel Box -->
    <rect x="0" y="0" width="450" height="480" rx="12" fill="#1E293B" stroke="#475569" stroke-width="3"/>

    <!-- Panel Header Bar -->
    <rect x="0" y="0" width="450" height="60" rx="12" fill="#0F172A"/>
    <circle cx="30" cy="30" r="8" fill="#EF4444"/>
    <circle cx="55" cy="30" r="8" fill="#FBBF24"/>
    <circle cx="80" cy="30" r="8" fill="#10B981"/>

    <!-- Simulated Code / PR Lines -->
    <rect x="30" y="90" width="240" height="14" rx="4" fill="#38BDF8" opacity="0.9"/>
    <rect x="30" y="120" width="360" height="10" rx="3" fill="#64748B" opacity="0.6"/>
    <rect x="30" y="140" width="300" height="10" rx="3" fill="#64748B" opacity="0.6"/>
    <rect x="30" y="160" width="330" height="10" rx="3" fill="#64748B" opacity="0.6"/>

    <!-- Passing Build Pill / Green Checkmark Badge -->
    <g transform="translate(30, 200)" filter="url(#glow)">
      <rect x="0" y="0" width="390" height="90" rx="10" fill="url(#greenPass)"/>
      <circle cx="50" cy="45" r="26" fill="#FFFFFF" opacity="0.2"/>
      <!-- Checkmark Icon -->
      <path d="M 38 45 L 47 54 L 64 34" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Mock Status Indicator Bars inside Pill -->
      <rect x="95" y="30" width="260" height="12" rx="4" fill="#FFFFFF" opacity="0.9"/>
      <rect x="95" y="50" width="180" height="10" rx="3" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- Approve Button Target -->
    <rect x="30" y="320" width="390" height="70" rx="8" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="2"/>
    <circle cx="225" cy="355" r="20" fill="#10B981"/>
    <path d="M 217 355 L 223 361 L 234 347" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Robotic Arm Approving PR (Foreground Right) -->
  <g id="robotic-arm" transform="translate(1150, 480)">
    <!-- Arm Joint Segment 1 -->
    <path d="M 280 350 L 150 180 L 110 200 L 240 370 Z" fill="url(#metalArm)" stroke="#334155" stroke-width="2"/>
    <circle cx="130" cy="190" r="22" fill="#475569" stroke="#0F172A" stroke-width="3"/>

    <!-- Arm Joint Segment 2 -->
    <path d="M 130 190 L 10 -40 L -20 -25 L 90 205 Z" fill="url(#metalArm)" stroke="#334155" stroke-width="2"/>
    <circle cx="-5" cy="-32" r="18" fill="#475569" stroke="#0F172A" stroke-width="3"/>

    <!-- Robotic End Effector / Actuator Finger pressing Approve -->
    <path d="M -5 -32 L -45 -105 L -65 -95 L -25 -22 Z" fill="#E3120B"/>
    <circle cx="-55" cy="-100" r="10" fill="#FBBF24" filter="url(#glow)"/>
  </g>
</svg>

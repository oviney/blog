<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Coverage is the BMI of Software Quality</title>
  <desc>An Economist-style editorial illustration of a towering green percentage meter glowing on a boardroom wall while beneath the floorboards a deep chasm reveals broken components and undetected faults.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="meterGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="chasmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3120B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="meterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Economist Red Header Strip -->
  <rect x="0" y="0" width="1600" height="16" fill="#E3120B"/>

  <!-- Architectural Background Grid -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="150" y1="80" x2="1450" y2="80"/>
    <line x1="150" y1="240" x2="1450" y2="240"/>
    <line x1="150" y1="400" x2="1450" y2="400"/>
    <line x1="150" y1="560" x2="1450" y2="560"/>
    <line x1="300" y1="40" x2="300" y2="860"/>
    <line x1="600" y1="40" x2="600" y2="860"/>
    <line x1="900" y1="40" x2="900" y2="860"/>
    <line x1="1200" y1="40" x2="1200" y2="860"/>
  </g>

  <!-- Upper Half: Boardroom Podium & Towering Green Meter -->
  <g transform="translate(850, 100)">
    <!-- Dashboard Meter Stand & Pillar -->
    <rect x="0" y="0" width="380" height="420" rx="14" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    
    <!-- Glowing Green Bar (93% Height) -->
    <g filter="url(#meterGlow)">
      <rect x="40" y="40" width="300" height="340" rx="8" fill="#0F172A"/>
      <rect x="40" y="70" width="300" height="310" rx="8" fill="url(#meterGreen)"/>
      <!-- Digital Metric Segments -->
      <line x1="40" y1="120" x2="340" y2="120" stroke="#0F172A" stroke-width="3"/>
      <line x1="40" y1="170" x2="340" y2="170" stroke="#0F172A" stroke-width="3"/>
      <line x1="40" y1="220" x2="340" y2="220" stroke="#0F172A" stroke-width="3"/>
      <line x1="40" y1="270" x2="340" y2="270" stroke="#0F172A" stroke-width="3"/>
      <line x1="40" y1="320" x2="340" y2="320" stroke="#0F172A" stroke-width="3"/>
    </g>

    <!-- Passing Checkmark Indicator at Meter Peak -->
    <circle cx="190" cy="40" r="28" fill="#10B981" filter="url(#meterGlow)"/>
    <path d="M 178 40 L 186 48 L 202 32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Executive Silhouette at Podium (Left Foreground) -->
  <g transform="translate(320, 180)">
    <!-- Executive Body & Arm Gesturing Towards Dashboard -->
    <circle cx="160" cy="110" r="38" fill="#E2E8F0"/>
    <path d="M 120 170 C 120 150, 200 150, 200 170 L 220 360 L 100 360 Z" fill="#334155"/>
    <path d="M 190 200 L 480 120 L 490 140 L 200 230 Z" fill="#475569"/>
    <!-- Pointing Hand -->
    <circle cx="495" cy="128" r="14" fill="#E2E8F0"/>
  </g>

  <!-- Floorboards / Separation Line -->
  <rect x="100" y="550" width="1400" height="20" fill="#334155" rx="4"/>

  <!-- Lower Half: Dark Subterranean Chasm (The Mutation Gap) -->
  <rect x="150" y="580" width="1300" height="270" rx="10" fill="url(#chasmGrad)" stroke="#1E293B" stroke-width="3"/>

  <!-- Jagged Fault Lines & Uncaught Bugs in the Chasm -->
  <g transform="translate(180, 600)">
    <!-- Red Fracture Lightning Lines -->
    <path d="M 100 40 L 220 110 L 350 70 L 490 160 L 640 90 L 800 180 L 1000 120" fill="none" stroke="url(#redAccent)" stroke-width="4" opacity="0.8"/>
    
    <!-- Faulted Logic Component 1 -->
    <polygon points="180,120 250,90 280,150 210,180" fill="#1E293B" stroke="#E3120B" stroke-width="2.5"/>
    <circle cx="230" cy="135" r="8" fill="#E3120B"/>

    <!-- Faulted Logic Component 2 -->
    <polygon points="520,70 600,60 580,130 500,120" fill="#1E293B" stroke="#F97316" stroke-width="2.5"/>
    <circle cx="550" cy="95" r="8" fill="#F97316"/>

    <!-- Faulted Logic Component 3 -->
    <polygon points="760,110 840,80 880,140 800,170" fill="#1E293B" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="820" cy="125" r="8" fill="#EF4444"/>

    <!-- Surviving Mutant Nodes (Undetected Faults) -->
    <circle cx="340" cy="180" r="14" fill="#0F172A" stroke="#E3120B" stroke-width="3"/>
    <path d="M 333 173 L 347 187 M 347 173 L 333 187" stroke="#E3120B" stroke-width="3" stroke-linecap="round"/>

    <circle cx="950" cy="170" r="14" fill="#0F172A" stroke="#E3120B" stroke-width="3"/>
    <path d="M 943 163 L 957 177 M 957 163 L 943 177" stroke="#E3120B" stroke-width="3" stroke-linecap="round"/>

    <circle cx="660" cy="190" r="12" fill="#0F172A" stroke="#F97316" stroke-width="2.5"/>
    <path d="M 654 184 L 666 196 M 666 184 L 654 196" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
